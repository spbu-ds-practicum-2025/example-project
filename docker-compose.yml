version: '3.8'

services:
  # PostgreSQL Database for Bank Service
  postgres:
    image: postgres:17-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: bank_service
      POSTGRES_PASSWORD: bank_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_service -d bank_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet-network

  # ClickHouse Database for Analytics Service
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: wallet-clickhouse
    environment:
      CLICKHOUSE_DB: analytics_db
      CLICKHOUSE_USER: analytics_service
      CLICKHOUSE_PASSWORD: analytics_service
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wallet-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: wallet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet-network

  # RabbitMQ Initialization
  rabbitmq-init:
    image: rabbitmq:3.13-management-alpine
    container_name: wallet-rabbitmq-init
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - wallet-network
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Waiting for RabbitMQ management plugin to be ready...'
        max_attempts=30
        attempt=0
        until rabbitmqadmin --host=rabbitmq --username=guest --password=guest list exchanges > /dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ $$attempt -ge $$max_attempts ]; then
            echo "Failed to connect to RabbitMQ after $$max_attempts attempts"
            exit 1
          fi
          echo "Waiting for RabbitMQ management API (attempt $$attempt/$$max_attempts)..."
          sleep 2
        done
        echo 'RabbitMQ management API is ready'
        echo 'Configuring RabbitMQ...'
        rabbitmqadmin --host=rabbitmq --username=guest --password=guest declare exchange name=bank.operations type=topic durable=true
        rabbitmqadmin --host=rabbitmq --username=guest --password=guest declare queue name=analytics.transfer.completed durable=true auto_delete=false
        rabbitmqadmin --host=rabbitmq --username=guest --password=guest declare binding source=bank.operations destination=analytics.transfer.completed routing_key=bank.operations.transfer.completed
        echo 'RabbitMQ configuration completed successfully'
    restart: "no"

  # Bank Service Migrations
  bank-migrations:
    image: postgres:17-alpine
    container_name: wallet-bank-migrations
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: bank_db
      PGUSER: bank_service
      PGPASSWORD: bank_service
    volumes:
      - ./services/bank-service/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wallet-network
    command: >
      sh -c "
        echo 'Running bank-service migrations...' &&
        for file in /migrations/*.up.sql; do
          echo \"Applying migration: $$(basename $$file)\" &&
          psql -v ON_ERROR_STOP=1 -f \"$$file\" || exit 1;
        done &&
        echo 'Bank migrations completed successfully'
      "
    restart: "no"

  # Bank Service
  bank-service:
    build:
      context: ./services/bank-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgres://bank_service:bank_service@postgres:5432/bank_db?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      PORT: "50051"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bank-migrations:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:50051/health", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - wallet-network
    restart: unless-stopped
    deploy:
      replicas: 3

  # Analytics Service Migrations
  analytics-migrations:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: wallet-analytics-migrations
    volumes:
      - ./services/analytics-service/migrations:/migrations:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - wallet-network
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Running analytics-service migrations...'
        echo 'Waiting for ClickHouse DNS to be available...'
        max_dns_attempts=30
        dns_attempt=0
        until getent hosts clickhouse > /dev/null 2>&1; do
          dns_attempt=$$((dns_attempt + 1))
          if [ $$dns_attempt -ge $$max_dns_attempts ]; then
            echo "Failed to resolve ClickHouse DNS after $$max_dns_attempts attempts"
            exit 1
          fi
          echo "Waiting for ClickHouse DNS (attempt $$dns_attempt/$$max_dns_attempts)..."
          sleep 1
        done
        echo 'ClickHouse DNS resolved, waiting for service to be ready...'
        max_attempts=60
        attempt=0
        until clickhouse-client --host=clickhouse --port=9000 --user=analytics_service --password=analytics_service --query="SELECT 1" > /dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ $$attempt -ge $$max_attempts ]; then
            echo "Failed to connect to ClickHouse after $$attempt attempts"
            clickhouse-client --host=clickhouse --port=9000 --user=analytics_service --password=analytics_service --query="SELECT 1"
            exit 1
          fi
          echo "Waiting for ClickHouse (attempt $$attempt/$$max_attempts)..."
          sleep 2
        done
        echo 'ClickHouse is ready, applying migrations...'
        for file in /migrations/*.up.sql; do
          if [ -f "$$file" ]; then
            echo "Applying migration: $$(basename $$file)"
            clickhouse-client \
              --host=clickhouse \
              --port=9000 \
              --database=analytics_db \
              --user=analytics_service \
              --password=analytics_service \
              --multiquery < "$$file" || exit 1
          fi
        done
        echo 'Analytics migrations completed successfully'
    restart: "no"

  # Analytics Service
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: wallet-analytics-service
    environment:
      CLICKHOUSE_HOST: "clickhouse:9000"
      CLICKHOUSE_DB: "analytics_db"
      CLICKHOUSE_USER: "analytics_service"
      CLICKHOUSE_PASSWORD: "analytics_service"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_EXCHANGE: "bank.operations"
      RABBITMQ_QUEUE: "analytics.transfer.completed"
      RABBITMQ_ROUTING_KEY: "bank.operations.transfer.completed"
      GRPC_PORT: "50052"
    ports:
      - "50052:50052"
    depends_on:
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      analytics-migrations:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:50052/health", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - wallet-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: wallet-api-gateway
    environment:
      BANK_SERVICE_ADDR: "bank-service:50051"
      ANALYTICS_SERVICE_ADDR: "analytics-service:50052"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - bank-service
      - analytics-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - wallet-network
    restart: unless-stopped

networks:
  wallet-network:
    driver: bridge
    name: wallet-network

volumes:
  postgres_data:
    name: wallet-postgres-data
  clickhouse_data:
    name: wallet-clickhouse-data
  rabbitmq_data:
    name: wallet-rabbitmq-data
